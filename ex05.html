<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let idade = parseInt(prompt('Digite sua idade: '));

        if (idade <= 12) {
            console.log(`Idade menor que 12 é crianca!`);
        } else if (idade < 18) {
            console.log(`Idade entre 12 e 17 é adolescente!`);
        } else {
            console.log(`Idade maior que 18 é adulto!`);
        }
    </script>
</body>
</html>
